name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nomiqa
          POSTGRES_PASSWORD: nomiqa_ci
          POSTGRES_DB: nomiqa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nomiqa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nomiqa:nomiqa_ci@localhost:5432/nomiqa_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile يفشل إذا لم يطابق الـlockfile ملفات package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # سكربتات قاعدة البيانات تقرأ .env في الجذر عبر dotenv-cli.
      # متغيرات البيئة الحقيقية المضبوطة أعلاه لها الأولوية ولا يستبدلها dotenv.
      - name: Create .env for tooling
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm --filter @nomiqa/database migrate:deploy

      - name: Test
        run: pnpm test

      # اختبارات عزل المؤسسات مقابل PostgreSQL حقيقي بدور NOBYPASSRLS.
      # هذه هي الطبقة الخامسة من طبقات العزل: بدونها قد ينكسر العزل
      # بتعديل استعلام واحد دون أن يلاحظه أحد.
      - name: Tenant isolation tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
